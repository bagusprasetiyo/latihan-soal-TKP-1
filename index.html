<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fbf6ec;--card:#fff;--ink:#1d2540;--mut:#667085;--or:#f5a524;--orx:#d98a0b;--gr:#5aa62d;--bl:#d9eaf3;--pu:#e6dcf6;--line:#efe4cc;--red:#d9534f;--sh:0 8px 24px rgba(60,40,0,.08);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161924;--card:#212639;--ink:#f1f1f6;--mut:#a3a9bd;--or:#f5a524;--orx:#f5b84d;--gr:#79c44a;--bl:#22384a;--pu:#37305a;--line:#343b57;--sh:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161924;--card:#212639;--ink:#f1f1f6;--mut:#a3a9bd;--or:#f5a524;--orx:#f5b84d;--gr:#79c44a;--bl:#22384a;--pu:#37305a;--line:#343b57;--sh:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
:root:root:root{--bg:#fff;--card:#fff;--ink:#2b1114;--mut:#7a5a5d;--or:#d32f2f;--orx:#b71c1c;--gr:#c62828;--bl:#fde8e8;--pu:#fbd9d9;--line:#f1cfcf;--sh:0 8px 24px rgba(183,28,28,.12);color-scheme:light}
.pill{background:#d32f2f;color:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans","Segoe UI",system-ui,sans-serif;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
.pill{display:inline-block;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px;padding:7px 16px;border-radius:999px;letter-spacing:.3px}
h1{font-family:"Noto Sans",system-ui,sans-serif;font-size:clamp(34px,8vw,56px);line-height:1.05;margin:14px 0 6px;font-weight:900}
.tag{font-style:italic;color:var(--mut);font-size:18px;margin:0 0 22px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:20px;margin-bottom:16px;border:1px solid var(--line)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.feat{background:var(--bg);border-radius:12px;padding:14px;border:1px solid var(--line);font-size:14px}
.feat b{display:block;margin-bottom:4px}
input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;margin:8px 0 14px}
.btn{border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:15px;cursor:pointer;color:#fff;background:var(--or)}
.btn:hover{background:var(--orx)}.btn.g{background:var(--gr)}.btn.b{background:var(--bl);color:var(--ink)}.btn.p{background:var(--pu);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--gr);border-radius:99px;transition:width .3s}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--pu);margin-right:6px}.chip.b{background:var(--bl)}
.q{font-size:17px;margin:12px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:15px;cursor:pointer;font-family:inherit}
.opt:hover{border-color:var(--or)}.opt.sel{border-color:var(--gr);background:color-mix(in srgb,var(--gr) 14%,var(--card))}
.ltr{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bl);display:grid;place-items:center;font-weight:800;font-size:14px}
.sel .ltr{background:var(--gr);color:#fff}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.dot{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.dot.done{background:var(--bl)}.dot.cur{border-color:var(--or);background:var(--or);color:#fff}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.score{text-align:center;padding:28px 16px;background:linear-gradient(135deg,var(--pu),var(--bl));border-radius:16px;margin-bottom:16px}
.score .n{font-size:64px;font-weight:900;line-height:1}.score small{color:var(--mut);display:block;margin-top:6px}
.kom{margin:8px 0}.kom .l{display:flex;justify-content:space-between;font-size:14px}
.rv .opt{cursor:default}.rv .opt:hover{border-color:var(--line)}
.pt{margin-left:auto;flex:none;font-weight:800;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--bl)}
.best{border-color:var(--gr)}.best .pt{background:var(--gr);color:#fff}.mine{border-color:var(--or);background:color-mix(in srgb,var(--or) 15%,var(--card))}
.ex{background:var(--bg);border-left:4px solid var(--or);padding:12px 14px;border-radius:8px;font-size:14px;margin-top:6px}
.note{font-size:13px;color:var(--mut)}
@media(max-width:520px){.wrap{padding:14px 12px 50px}.score .n{font-size:52px}}
</style>

<script>
// k=kompetensi, s=soal, o=[opsi,poin], e=pembahasan. Urutan opsi diacak tiap percobaan.
const BANK=[
{k:"Pelayanan Publik",s:"Menjelang berakhirnya jam operasional loket administrasi kependudukan, antrean pemohon masih mengular sementara Anda hanya memiliki sisa waktu lima belas menit. Seorang warga lanjut usia yang menempuh perjalanan berjam-jam dari desa terpencil memohon agar berkas KTP-nya tetap diproses, padahal fotokopi kartu keluarga yang dipersyaratkan tidak ia bawa.",o:[["Mengidentifikasi kemungkinan verifikasi data kartu keluarga melalui sistem informasi kependudukan terintegrasi, memproses permohonan seketika apabila data valid, dan bila tidak memungkinkan menguraikan kekurangan persyaratan secara empatik seraya memfasilitasi pelengkapannya seefisien mungkin.",5],["Menguraikan kekurangan persyaratan secara santun, kemudian memberikan prioritas penyelesaian kepada warga lanjut usia tersebut begitu dokumen yang diperlukan berhasil dilengkapi di lokasi pelayanan.",4],["Menerima berkas yang tersedia untuk diproses secara parsial, lalu menugaskan keluarga pemohon menyerahkan kelengkapan administrasi pada hari kerja berikutnya sebagai bentuk kompromi.",3],["Menegaskan bahwa ketentuan prosedural bersifat mengikat tanpa pengecualian sehingga pemohon dipersilakan kembali pada hari lain dengan membawa seluruh persyaratan yang lazim.",2],["Memproses permohonan secara penuh atas dasar belas kasihan terhadap kondisi pemohon, kendati persyaratan administratif jelas belum terpenuhi.",1]],e:"Poin 5 mengharmonikan empati dengan akuntabilitas prosedural melalui solusi yang sah. Poin 4 santun namun belum mengupayakan solusi substantif. Poin 3 membuka celah maladministrasi. Poin 2 legalistik dan kurang responsif. Poin 1 melanggar prosedur."},
{k:"Pelayanan Publik",s:"Aplikasi layanan daring instansi Anda mengalami gangguan berulang yang memicu gelombang keluhan bernada emosional dari warga di kanal media sosial resmi, sementara atasan belum menerbitkan arahan apa pun terkait strategi komunikasi krisis.",o:[["Menanggapi secara santun disertai permohonan maaf, mengumpulkan rincian kendala melalui pesan langsung, mengeskalasikannya kepada tim teknis, serta menginformasikan perkembangan penanganan kepada pelapor secara berkala.",5],["Mengeskalasikan seluruh keluhan kepada tim teknis dan atasan, kemudian menangguhkan tanggapan hingga memperoleh arahan resmi agar tidak terjadi inkonsistensi informasi.",4],["Memberikan jawaban normatif bahwa perbaikan sedang berlangsung dan menganjurkan warga mendatangi kantor secara langsung untuk memperoleh layanan alternatif.",3],["Menghapus komentar bernada emosional demi menjaga reputasi institusi, lalu melaporkan kendala tersebut kepada tim teknis secara internal.",2],["Tidak mengambil tindakan apa pun lantaran merasa persoalan itu bukan ranah kewenangan Anda dan menunggu penunjukan petugas.",1]],e:"Poin 5 responsif, empatik, dan menutup siklus informasi. Poin 4 benar tetapi pasif. Poin 3 membebankan solusi kepada warga. Poin 2 mengabaikan prinsip transparansi. Poin 1 apatis terhadap kewajiban pelayanan."},
{k:"Pelayanan Publik",s:"Seorang warga menanyakan perihal mekanisme penyaluran bantuan sosial yang berada di luar lingkup tugas unit Anda, dan Anda sendiri belum menguasai regulasi terbaru yang melandasinya secara komprehensif.",o:[["Mengakui secara jujur keterbatasan pengetahuan Anda, menghubungi unit yang berkompeten saat itu juga, kemudian menyampaikan informasi yang telah terverifikasi kepada warga tersebut.",5],["Mengantarkan warga menuju unit terkait dan memastikan petugas di sana bersedia menerima serta menindaklanjuti pertanyaannya.",4],["Memberikan nomor kontak unit yang berwenang agar warga dapat menghubunginya secara mandiri.",3],["Menjelaskan sebisanya berdasarkan asumsi pribadi agar warga tidak pulang tanpa memperoleh keterangan sama sekali.",2],["Menyatakan dengan tegas bahwa hal tersebut bukan bidang yang menjadi tanggung jawab Anda.",1]],e:"Informasi keliru lebih berbahaya daripada ketidaktahuan yang diakui. Poin 5 menjamin validitas jawaban. Poin 4 membantu namun tanpa kepastian hasil. Poin 3 sekadar merujuk. Poin 2 berisiko menyesatkan. Poin 1 menolak melayani."},
{k:"Integritas",s:"Atasan langsung Anda menginstruksikan penyesuaian angka realisasi anggaran pada laporan triwulan agar capaian tampak mencapai seratus persen, dengan dalih bahwa selisihnya sangat kecil, tidak merugikan keuangan negara, dan lazim dilakukan demi menjaga muruah unit kerja.",o:[["Menolak instruksi tersebut secara santun dan argumentatif, seraya mengusulkan pencantuman catatan penjelasan atas penyebab selisih beserta rencana korektif yang terukur.",5],["Menolak mengubah angka dan menyerahkan data sebagaimana adanya tanpa memberikan penjelasan tambahan kepada atasan.",4],["Melaporkan instruksi tersebut langsung kepada pimpinan yang lebih tinggi tanpa terlebih dahulu mendiskusikannya dengan atasan Anda.",3],["Menuruti instruksi tetapi menyimpan data otentik sebagai arsip pribadi guna berjaga-jaga apabila kelak diaudit.",2],["Menuruti instruksi sepenuhnya sebab tanggung jawab substantif berada pada pundak atasan.",1]],e:"Integritas menuntut kesesuaian data dengan fakta tanpa merusak relasi kerja. Poin 5 menolak sekaligus menawarkan alternatif legal. Poin 4 kaku. Poin 3 melompati jalur kolegial. Poin 2 turut berpartisipasi dalam manipulasi. Poin 1 mendelegasikan tanggung jawab moral."},
{k:"Integritas",s:"Sahabat karib Anda yang sama-sama mengikuti seleksi CPNS menawarkan materi soal SKD yang konon bersumber dari oknum internal panitia, seraya memohon agar Anda menjaga kerahasiaan informasi itu demi keselamatan bersama.",o:[["Menolak dengan tegas, mengingatkan konsekuensi hukum dan etis yang akan menimpanya, kemudian melaporkan indikasi kebocoran tersebut kepada panitia seleksi yang berwenang.",5],["Menolak dengan tegas dan menasihati sahabat tersebut, tetapi tidak melaporkannya demi menjaga keutuhan persahabatan.",4],["Menolak tawaran itu lalu secara perlahan menjaga jarak dari sahabat tersebut.",3],["Menerima materi itu sekadar untuk disimpan tanpa niat mempelajarinya.",2],["Mempelajari materi tersebut karena meyakini peserta lain pun memiliki akses serupa.",1]],e:"Penolakan belaka belum memadai bila Anda mengetahui potensi kecurangan sistemik. Poin 5 menjaga keadilan kompetisi. Poin 4 membiarkan kebocoran. Poin 3 pasif. Poin 2 telah menguasai materi terlarang. Poin 1 merasionalisasi kecurangan."},
{k:"Orientasi pada Hasil",s:"Laporan konsolidasi wajib terkirim esok pagi. Pada sore hari Anda menemukan anomali data pada satu wilayah yang diduga akibat kekeliruan penginputan rekan, sedangkan proses verifikasi memerlukan waktu sekitar tiga jam.",o:[["Memverifikasi anomali tersebut langsung kepada sumber data, bersedia bekerja melampaui jam kerja bila diperlukan, serta memberitahukan atasan mengenai potensi keterlambatan sedini mungkin.",5],["Memverifikasi anomali dan menuntaskan laporan tanpa mengabarkan atasan lantaran yakin dapat memenuhi tenggat.",4],["Menyerahkan laporan tepat waktu disertai catatan bahwa data satu wilayah masih memerlukan verifikasi lanjutan.",3],["Menyerahkan laporan tepat waktu lalu melakukan koreksi hanya apabila ada pihak yang menyampaikan keberatan.",2],["Meminta rekan yang menginput untuk memperbaikinya sendiri keesokan hari dan menunda pengiriman laporan.",1]],e:"Orientasi pada hasil berarti tuntas, akurat, dan akuntabel. Poin 5 menjamin kualitas dan transparan atas risiko. Poin 4 kurang komunikatif. Poin 3 menyerahkan hasil yang diketahui belum valid. Poin 2 reaktif. Poin 1 mengalihkan tanggung jawab."},
{k:"Orientasi pada Hasil",s:"Seorang rekan junior menyampaikan dengan intonasi kurang bersahabat bahwa format laporan buatan Anda tidak selaras dengan SOP terbaru, padahal selama ini atasan tidak pernah menyampaikan keberatan apa pun terhadap pekerjaan Anda.",o:[["Menelaah SOP terbaru, memperbaiki laporan apabila terbukti benar, menyampaikan apresiasi kepada rekan tersebut, lalu mengonfirmasi kepada atasan demi keseragaman format seluruh anggota tim.",5],["Memperbaiki laporan sesuai SOP terbaru setelah memastikan kebenarannya dan mengucapkan terima kasih kepada rekan tersebut.",4],["Menanyakan kepada atasan apakah format lama masih dapat ditoleransi untuk periode berjalan.",3],["Mempertahankan format lama dengan dalih bahwa atasan tidak pernah mempermasalahkannya.",2],["Menegur rekan tersebut agar tidak mencampuri pekerjaan yang bukan ranah kewenangannya.",1]],e:"Menerima masukan tanpa memandang pengirim dan nada penyampaiannya merupakan inti orientasi hasil. Poin 5 memverifikasi, memperbaiki, dan menyeragamkan. Poin 4 belum menjamin konsistensi tim. Poin 3 mencari dispensasi. Poin 2 mengabaikan standar. Poin 1 defensif."},
{k:"Pengambilan Keputusan",s:"Sebagai ketua panitia, satu jam sebelum seminar nasional dimulai Anda mendapat kabar bahwa narasumber utama berhalangan hadir karena sakit mendadak. Anda tidak memiliki kewenangan menambah anggaran, sedangkan pimpinan sedang berada dalam perjalanan dan sulit dihubungi.",o:[["Berupaya menghubungi pimpinan untuk melaporkan situasi dan memohon keputusan, sembari menyiapkan alternatif yang berada dalam batas kewenangan, seperti narasumber pengganti dari internal.",5],["Menunjuk pembicara internal sesuai pagu tanpa menunggu persetujuan pimpinan, kemudian melaporkannya seusai acara.",4],["Menunda pelaksanaan seminar hingga pimpinan tiba dan dapat memberikan keputusan.",3],["Mengundang narasumber eksternal berbayar dengan dana pribadi lalu mengajukan penggantian biaya.",2],["Membatalkan seminar dan menyampaikan permohonan maaf kepada seluruh peserta.",1]],e:"Keputusan harus proaktif namun tidak melampaui kewenangan. Poin 5 berkonsultasi dan menyiapkan solusi. Poin 4 bertindak tanpa konfirmasi. Poin 3 menghentikan proses. Poin 2 melanggar tata kelola keuangan. Poin 1 menyerah."},
{k:"Pengambilan Keputusan",s:"Anda ditugasi menetapkan vendor percetakan. Vendor A menawarkan harga lebih rendah namun memiliki rekam jejak keterlambatan, sedangkan vendor B menawarkan harga sedikit lebih tinggi dengan ketepatan waktu yang konsisten. Keduanya masih dalam pagu, dan sejumlah rekan menekan Anda memilih vendor A.",o:[["Mengomparasikan kedua vendor berdasarkan kriteria pengadaan yang objektif meliputi kualitas, rekam jejak, dan harga, memilih yang paling memenuhi kriteria, serta mendokumentasikan dasar pertimbangannya.",5],["Memilih vendor B semata-mata karena rekam jejaknya lebih baik tanpa menimbang kriteria lain.",4],["Menyerahkan keputusan sepenuhnya kepada pimpinan dengan alasan menghindari risiko.",3],["Memilih vendor A demi efisiensi anggaran semata.",2],["Memilih vendor A mengikuti tekanan rekan agar tidak menimbulkan friksi.",1]],e:"Keputusan wajib berbasis kriteria objektif yang dapat dipertanggungjawabkan. Poin 5 sistematis dan terdokumentasi. Poin 4 pertimbangan sempit. Poin 3 melepas tanggung jawab. Poin 2 hanya menimbang harga. Poin 1 tunduk pada tekanan sosial."},
{k:"Kerja Sama",s:"Dalam tim yang beranggotakan lima orang, dua anggota berselisih paham mengenai distribusi tugas sehingga progres proyek mulai tertinggal dari jadwal. Anda hanyalah anggota biasa tanpa otoritas struktural terhadap keduanya.",o:[["Memfasilitasi pertemuan kedua pihak untuk merumuskan pembagian tugas berdasarkan kapabilitas masing-masing, kemudian memohon pengesahan dari ketua tim.",5],["Melaporkan perselisihan tersebut kepada ketua tim agar ia mengambil keputusan penengah.",4],["Mengambil alih sebagian tugas kedua anggota tersebut agar proyek tetap berjalan sesuai tenggat.",3],["Berfokus pada tugas pribadi sampai keduanya menyelesaikan perselisihan secara mandiri.",2],["Memihak anggota yang lebih senior agar perselisihan lekas mereda.",1]],e:"Kerja sama efektif mendayagunakan kekuatan anggota dan mencari solusi kolektif. Poin 5 proaktif sekaligus menghormati hierarki. Poin 4 tanpa upaya mediasi. Poin 3 hanya menambal gejala. Poin 2 apatis. Poin 1 partisan."},
{k:"Kerja Sama",s:"Seorang rekan dari unit lain enggan membagikan data yang Anda butuhkan lantaran menganggapnya sangat sensitif, sementara tenggat penyelesaian pekerjaan lintas unit telah mendekat dan atasan Anda menuntut kepastian.",o:[["Memahami kekhawatirannya, menjelaskan tujuan penggunaan data, menawarkan pembatasan akses atau anonimisasi, dan melibatkan atasan kedua belah pihak apabila diperlukan.",5],["Memohon atasan Anda menerbitkan surat resmi permintaan data kepada unit tersebut.",4],["Mencari data substitusi dari sumber publik meskipun cakupannya kurang komprehensif.",3],["Meminta bantuan rekan lain yang akrab dengannya untuk membujuk agar data diberikan.",2],["Melaporkan kepada atasan bahwa unit tersebut bersikap tidak kooperatif.",1]],e:"Membangun aliansi berarti memahami kepentingan pihak lain dan menegosiasikan solusi saling menguntungkan. Poin 5 menjawab kekhawatiran sekaligus kebutuhan. Poin 4 birokratis. Poin 3 mengorbankan kualitas. Poin 2 manipulatif. Poin 1 menyalahkan."},
{k:"Pengembangan Diri dan Orang Lain",s:"Anda memimpin tim kecil, dan salah seorang anggotanya senantiasa pasif dalam forum rapat meskipun hasil kerjanya konsisten baik. Anda berkeinginan agar ia berkembang menjadi pribadi yang lebih artikulatif dan berani menyampaikan gagasan.",o:[["Berdialog empat mata untuk memahami hambatan yang ia rasakan, kemudian memberinya tugas presentasi berskala kecil secara bertahap disertai umpan balik konstruktif.",5],["Menunjuknya menyampaikan laporan pada rapat berikutnya agar terbiasa berbicara di hadapan forum.",4],["Mengapresiasi hasil kerjanya secara terbuka agar tumbuh kepercayaan dirinya.",3],["Membiarkannya sebab kinerjanya sudah memuaskan.",2],["Menegurnya di hadapan tim agar lebih partisipatif.",1]],e:"Pengembangan orang lain bertolak dari pemahaman kebutuhan individu, lalu pemberian kesempatan terukur dan umpan balik. Poin 5 paling lengkap. Poin 4 berpotensi menekan. Poin 3 positif namun tidak mengubah perilaku. Poin 2 abai. Poin 1 merusak kepercayaan diri."},
{k:"TIK – Mengelola Perubahan",s:"Instansi Anda bertransformasi dari sistem pengarsipan manual menuju sistem digital terintegrasi dengan tenggat migrasi dua pekan. Seorang rekan senior menunjukkan resistensi dan kerap mengeluhkan kerumitan sistem baru.",o:[["Menyimak kesulitan rekan senior, mendampinginya belajar seraya memperlihatkan manfaat sistem terhadap pekerjaannya, dan menyampaikan kendala umum kepada tim implementasi.",5],["Menyusun panduan ringkas penggunaan sistem lalu membagikannya kepada seluruh anggota tim.",4],["Menganjurkan rekan senior mengikuti pelatihan resmi yang diselenggarakan instansi.",3],["Menyelesaikan migrasi bagian Anda sendiri dan membiarkan rekan senior memakai cara lama untuk sementara waktu.",2],["Memohon atasan mewajibkan seluruh pegawai memakai sistem baru tanpa pengecualian.",1]],e:"Mengelola perubahan berarti membantu individu beradaptasi, bukan hanya menuntaskan aspek teknis. Poin 5 empatik, personal, dan sistemik. Poin 4 generik. Poin 3 melepas tanggung jawab. Poin 2 menghambat transisi. Poin 1 koersif."},
{k:"Sosial Budaya",s:"Anda baru ditempatkan di wilayah dengan bahasa lokal yang belum Anda kuasai. Pada suatu rapat koordinasi, para rekan menggunakan bahasa daerah dalam durasi cukup panjang sehingga Anda tidak memahami keputusan strategis yang disepakati.",o:[["Mengikuti rapat dengan santun, memohon penjelasan singkat pada jeda pembicaraan, mencatat keputusan, mengonfirmasi ulang seusai rapat, serta mulai mempelajari dasar bahasa daerah.",5],["Mencatat jalannya rapat dan menanyakan hasilnya kepada rekan seusai rapat berakhir.",4],["Meminta agar rapat dilaksanakan sepenuhnya dalam bahasa Indonesia.",3],["Berdiam diri dan mengandalkan notulen sebagai rujukan keputusan.",2],["Berprasangka bahwa mereka sengaja mengucilkan Anda dari proses pengambilan keputusan.",1]],e:"Kompetensi sosial budaya menuntut penghormatan kearifan lokal tanpa menghambat tugas. Poin 5 adaptif dan aktif. Poin 4 berisiko keputusan terlanjur berjalan. Poin 3 memaksakan preferensi. Poin 2 pasif. Poin 1 berprasangka."},
{k:"Anti Radikalisme",s:"Dalam grup percakapan daring kantor, seorang rekan membagikan konten yang merendahkan kelompok agama tertentu sekaligus menyerukan penolakan terhadap kebijakan pemerintah secara agitatif, dan beberapa anggota grup tampak mendukungnya.",o:[["Menyampaikan secara personal bahwa konten tersebut berpotensi memecah belah kohesi sosial, mengajaknya berdiskusi dengan rujukan yang valid, dan melapor kepada atasan apabila perilaku itu berulang.",5],["Menyanggah isi konten di dalam grup dengan menyertakan data serta sumber yang kredibel.",4],["Langsung melaporkan rekan tersebut kepada atasan tanpa terlebih dahulu menegurnya.",3],["Keluar dari grup agar tidak terseret dalam polemik tersebut.",2],["Turut menyebarkan konten itu karena banyak anggota yang menyetujuinya.",1]],e:"Menyikapi paham intoleran memerlukan ketegasan yang proporsional dan beradab. Poin 5 mengedepankan dialog lalu eskalasi bertahap. Poin 4 berani tetapi dapat memicu polemik terbuka. Poin 3 melewatkan pembinaan. Poin 2 menghindar. Poin 1 turut menyebarkan intoleransi."},
{k:"Pelayanan Publik",s:"Seorang pemohon layanan perizinan meluapkan amarahnya secara verbal di hadapan antrean lantaran proses yang dianggapnya berlarut-larut, sehingga suasana ruang pelayanan menjadi tidak kondusif dan pemohon lain mulai merasa terganggu.",o:[["Menyimak keluhannya hingga emosinya mereda, menyampaikan permohonan maaf atas ketidaknyamanan yang dialami, lalu menguraikan kendala yang menyebabkan keterlambatan beserta estimasi waktu penyelesaian yang realistis.",5],["Mengajak pemohon menuju ruang terpisah yang lebih privat dan menawarkan penyelesaian prioritas agar situasi segera terkendali.",4],["Meminta petugas keamanan menenangkan pemohon agar kegiatan pelayanan terhadap pemohon lain dapat berlangsung kembali.",3],["Menjelaskan bahwa seluruh pemohon wajib mengikuti urutan antrean yang sama tanpa ada pengecualian apa pun.",2],["Menanggapi dengan intonasi tinggi supaya pemohon menghentikan perilakunya yang dianggap mengganggu.",1]],e:"Poin 5 empatik dan memberi kepastian. Poin 4 memberi keistimewaan yang mencederai asas keadilan. Poin 3 sekadar mengalihkan. Poin 2 kaku. Poin 1 memperkeruh situasi."},
{k:"Pelayanan Publik",s:"Seorang warga penyandang disabilitas netra tampak kesulitan mengisi formulir permohonan daring di loket Anda, sementara jumlah pengunjung saat itu relatif sedikit dan belum ada seorang pun yang menawarkan bantuan kepadanya.",o:[["Menghampirinya secara proaktif, menanyakan bentuk bantuan yang paling ia perlukan, lalu mendampinginya mengisi formulir dengan tetap menjaga kerahasiaan data pribadinya.",5],["Menyediakan formulir kertas sebagai alternatif dan mengisinya sesuai dikte warga tersebut.",4],["Menyarankan agar warga tersebut datang kembali pada lain waktu bersama anggota keluarga yang dapat mendampinginya.",3],["Menunggu sampai warga tersebut secara eksplisit memohon bantuan kepada petugas.",2],["Menyuruhnya mengisi sendiri sesuai ketentuan yang berlaku bagi seluruh pemohon.",1]],e:"Pelayanan inklusif bersifat proaktif dan menjaga privasi. Poin 4 baik namun tanpa opsi daring. Poin 3 menunda layanan. Poin 2 pasif. Poin 1 mengabaikan kebutuhan khusus."},
{k:"Pelayanan Publik",s:"Menjelang berakhirnya jam kerja, Anda menemukan sebuah surat permohonan warga yang terselip di antara tumpukan arsip, padahal batas waktu penyelesaian layanan atas permohonan tersebut jatuh pada hari ini juga.",o:[["Memprosesnya saat itu juga, menghubungi pemohon untuk menyampaikan perkembangan, serta mencatat penyebab keterselipan agar dapat dirumuskan langkah pencegahan di kemudian hari.",5],["Memprosesnya saat itu juga dan menghubungi pemohon untuk memberitahukan bahwa permohonannya telah ditindaklanjuti.",4],["Mengajukan permohonan perpanjangan tenggat kepada atasan dengan menjelaskan kronologi keterselipan surat.",3],["Menunda pemrosesan hingga esok pagi dengan alasan jam kerja telah usai.",2],["Membiarkannya hingga pemohon sendiri yang menanyakan kejelasan permohonannya.",1]],e:"Poin 5 tuntas dan memperbaiki sistem. Poin 4 tuntas tanpa perbaikan. Poin 3 mengelak dari tenggat. Poin 2 mengingkari standar pelayanan. Poin 1 abai."},
{k:"Pelayanan Publik",s:"Seorang warga mengadukan kepada Anda bahwa ia dimintai sejumlah uang di luar tarif resmi oleh salah seorang rekan sekantor Anda sebagai syarat percepatan penerbitan dokumen, namun ia ragu untuk melaporkannya secara resmi.",o:[["Mencatat pengaduan secara cermat, menjelaskan mekanisme pengaduan resmi beserta jaminan perlindungan pelapor, lalu meneruskannya kepada unit pengawasan internal.",5],["Menyarankan warga melaporkan sendiri kejadian tersebut kepada inspektorat atau lembaga pengawas terkait.",4],["Menegur rekan tersebut secara personal agar tidak mengulangi perbuatannya.",3],["Meminta warga menyertakan bukti tertulis terlebih dahulu sebelum pengaduannya dapat ditindaklanjuti.",2],["Membujuk warga agar melupakan persoalan itu demi menjaga keharmonisan antarpegawai.",1]],e:"Poin 5 menindaklanjuti sesuai mekanisme dan melindungi pelapor. Poin 4 melempar tanggung jawab. Poin 3 tidak menuntaskan. Poin 2 menghambat. Poin 1 melindungi pelanggaran."},
{k:"Integritas",s:"Di area parkir kantor, Anda menemukan sebuah dompet berisi sejumlah uang tunai dan kartu identitas milik seseorang yang tidak Anda kenal, sedangkan tidak ada satu pun saksi yang melihat Anda memungutnya.",o:[["Menyerahkan dompet beserta isinya kepada petugas keamanan dengan membuat berita acara serah terima, kemudian membantu menghubungi pemilik melalui alamat yang tertera pada kartu identitas.",5],["Menyerahkan dompet beserta isinya kepada petugas keamanan tanpa membuat dokumentasi apa pun.",4],["Menyimpannya terlebih dahulu hingga pemilik datang mencari barang miliknya.",3],["Mengambil sebagian uang tunainya, lalu menyerahkan dompet tersebut kepada petugas.",2],["Membiarkannya karena menganggap hal itu bukan urusan Anda.",1]],e:"Poin 5 transparan, akuntabel, dan aktif. Poin 4 benar namun tanpa bukti. Poin 3 berisiko tuduhan. Poin 2 tindak pencurian. Poin 1 apatis."},
{k:"Integritas",s:"Anda tanpa sengaja melakukan kekeliruan kalkulasi pada dokumen pembayaran yang telah dicairkan, dan hingga saat ini belum ada seorang pun yang menyadari adanya selisih nominal tersebut.",o:[["Segera melaporkannya kepada atasan, menyampaikan rencana koreksi yang konkret, kemudian merealisasikan perbaikan sesuai prosedur.",5],["Memperbaikinya secara diam-diam melalui pembayaran periode berikutnya tanpa pemberitahuan.",4],["Menunggu hingga ada pihak yang menemukan kekeliruan tersebut.",3],["Menyalahkan sistem aplikasi apabila kelak dimintai keterangan.",2],["Menyembunyikan seluruh dokumen yang berkaitan dengan pembayaran itu.",1]],e:"Poin 5 jujur dan bertanggung jawab. Poin 4 menutupi kesalahan. Poin 3 pasif. Poin 2 berbohong. Poin 1 manipulatif."},
{k:"Integritas",s:"Sebuah perusahaan penyedia barang mengirimkan parsel bernilai tinggi kepada Anda menjelang dimulainya proses evaluasi pengadaan yang menempatkan Anda sebagai salah seorang anggota tim penilai.",o:[["Mengembalikan parsel disertai surat penolakan resmi dan melaporkannya kepada unit pengendali gratifikasi.",5],["Mengembalikan parsel tersebut tanpa menyampaikan laporan kepada pihak mana pun.",4],["Menyerahkan parsel kepada kantor untuk dibagikan kepada seluruh pegawai.",3],["Menerima parsel itu, tetapi bertekad tetap menilai secara objektif.",2],["Menerima parsel itu karena sudah terlanjur dikirimkan ke alamat Anda.",1]],e:"Poin 5 sesuai ketentuan gratifikasi dan mencegah konflik kepentingan. Poin 4 kurang transparan. Poin 3 tetap menerima. Poin 2 konflik kepentingan. Poin 1 pelanggaran."},
{k:"Integritas",s:"Seorang rekan yang sering terlambat tiba di kantor berulang kali meminta Anda menitipkan tanda tangan kehadirannya, dengan alasan bahwa kemacetan di perjalanan berada di luar kendalinya.",o:[["Menolak dengan tegas, mengingatkan konsekuensi disipliner yang mengintainya, dan menyarankan agar ia mendiskusikan kendalanya secara terbuka dengan atasan.",5],["Menolak permintaan tersebut dan mengingatkan rekan itu agar memperbaiki kedisiplinannya.",4],["Menolak permintaan tersebut, namun tidak pernah lagi membicarakan persoalan itu dengannya.",3],["Menerima permintaan tersebut hanya pada kondisi yang benar-benar darurat.",2],["Menerima permintaan tersebut lantaran merasa sungkan menolak.",1]],e:"Poin 5 menolak sekaligus membantu akar persoalan. Poin 4 menolak saja. Poin 3 menghindar. Poin 2 menoleransi pelanggaran. Poin 1 turut berbuat curang."},
{k:"Orientasi pada Hasil",s:"Capaian target kinerja mingguan Anda baru mencapai delapan puluh persen lantaran seorang rekan satu tim sedang menjalani cuti, sementara atasan belum menugaskan Anda untuk melakukan kerja tambahan.",o:[["Mengevaluasi sisa pekerjaan, menyusun skala prioritas, lalu menyampaikan rencana penyelesaian beserta kebutuhan dukungan kepada atasan.",5],["Bekerja melampaui jam kerja secara senyap hingga seluruh target terpenuhi.",4],["Melaporkan capaian delapan puluh persen disertai penjelasan mengenai faktor penyebabnya.",3],["Menunggu rekan yang bercuti kembali bekerja sebelum melanjutkan pekerjaan.",2],["Menurunkan angka target agar capaian tampak telah terpenuhi.",1]],e:"Poin 5 terencana dan komunikatif. Poin 4 tidak transparan. Poin 3 hanya melapor. Poin 2 menunda. Poin 1 memanipulasi."},
{k:"Orientasi pada Hasil",s:"Anda menemukan suatu metode kerja yang jauh lebih efisien dibandingkan prosedur yang tercantum dalam SOP, tetapi penerapan metode tersebut belum memperoleh pengesahan resmi dari pimpinan unit.",o:[["Mengusulkannya kepada atasan beserta data hasil uji coba agar SOP dapat direvisi, sembari tetap menjalankan prosedur yang berlaku hingga pengesahan terbit.",5],["Menerapkannya setelah memperoleh izin lisan dari atasan tanpa dokumentasi apa pun.",4],["Menerapkannya secara diam-diam karena hasil akhirnya terbukti sama.",3],["Menyimpan temuan itu untuk kepentingan pribadi semata.",2],["Mengabaikannya karena enggan direpotkan proses birokrasi.",1]],e:"Poin 5 inovatif sekaligus patuh prosedur. Poin 4 tanpa dokumentasi. Poin 3 melanggar SOP. Poin 2 tidak berbagi manfaat. Poin 1 pasif."},
{k:"Orientasi pada Hasil",s:"Atasan berkali-kali mengoreksi pekerjaan Anda dan meminta perbaikan yang berulang, padahal Anda merasa telah mencurahkan kemampuan secara maksimal dalam menyusunnya.",o:[["Menanyakan secara rinci standar yang diharapkan, memperbaiki pekerjaan, lalu menyusun daftar periksa pribadi agar kekeliruan serupa tidak terulang.",5],["Memperbaiki pekerjaan sesuai koreksi tanpa menanyakan acuan standarnya.",4],["Meminta rekan memeriksa pekerjaan sebelum diserahkan kepada atasan.",3],["Menjelaskan kepada atasan bahwa pekerjaan Anda sebenarnya sudah baik.",2],["Memohon dipindahkan ke tugas lain yang dianggap lebih sesuai.",1]],e:"Poin 5 belajar dan mencegah pengulangan. Poin 4 reaktif. Poin 3 bergantung pada pihak lain. Poin 2 defensif. Poin 1 menghindar."},
{k:"Orientasi pada Hasil",s:"Pekerjaan besar dengan tenggat ketat tengah menumpuk, namun tiba-tiba pimpinan menugaskan Anda menyelesaikan satu tugas kecil yang bersifat mendesak dan harus rampung pada hari yang sama.",o:[["Menuntaskan tugas dari pimpinan, lalu menyampaikan dampaknya terhadap pekerjaan lain dan menyusun ulang jadwal penyelesaian secara realistis.",5],["Menuntaskan tugas dari pimpinan dan menunda pekerjaan lain tanpa memberi kabar kepada siapa pun.",4],["Memohon agar tugas kecil tersebut didelegasikan kepada rekan yang lebih senggang.",3],["Menuntaskan pekerjaan besar terlebih dahulu sebelum menyentuh tugas mendadak itu.",2],["Mengabaikan tugas mendadak tersebut karena sedang kewalahan.",1]],e:"Poin 5 prioritas, adaptif, dan komunikatif. Poin 4 kurang transparan. Poin 3 mengalihkan. Poin 2 mengabaikan prioritas pimpinan. Poin 1 tidak bertanggung jawab."},
{k:"Pengambilan Keputusan",s:"Dua orang pimpinan dari unit berbeda memberikan instruksi yang saling bertentangan atas satu tugas yang sama, sementara keduanya menuntut agar tugas itu rampung dalam waktu yang bersamaan.",o:[["Mempertemukan atau meminta klarifikasi bersama kedua pimpinan untuk menyamakan persepsi, kemudian bertindak sesuai kesepakatan yang dicapai.",5],["Mengikuti instruksi dari pimpinan yang secara struktural merupakan atasan langsung Anda.",4],["Mengikuti instruksi yang lebih dahulu Anda terima tanpa menimbang pertimbangan lain.",3],["Mengerjakan kedua versi instruksi secara bersamaan tanpa membedakan prioritas.",2],["Menunda pekerjaan hingga kedua pimpinan menanyakan perkembangannya.",1]],e:"Poin 5 menyelesaikan akar konflik. Poin 4 prosedural namun dapat memicu friksi. Poin 3 sembarangan. Poin 2 tidak efisien. Poin 1 pasif."},
{k:"Pengambilan Keputusan",s:"Data pemantauan di lapangan memperlihatkan bahwa implementasi suatu program menyimpang dari rencana awal, sedangkan atasan Anda tampak sangat optimis dan percaya diri bahwa program tersebut berjalan sesuai harapan.",o:[["Menyusun analisis ringkas berbasis data beserta opsi perbaikan, lalu mempresentasikannya secara santun kepada atasan.",5],["Melaporkan data tersebut apa adanya tanpa disertai usulan solusi.",4],["Mendiskusikannya terlebih dahulu dengan rekan senior sebelum mengambil sikap.",3],["Menunggu hingga atasan menyadari sendiri adanya penyimpangan tersebut.",2],["Menyembunyikan data demi menjaga suasana kerja agar tetap kondusif.",1]],e:"Poin 5 berbasis data dan solutif. Poin 4 minim solusi. Poin 3 menunda. Poin 2 pasif. Poin 1 menutupi fakta."},
{k:"Pengambilan Keputusan",s:"Dana bantuan yang tersedia hanya mencukupi untuk sebagian dari seluruh warga yang mengajukan permohonan, dan Anda dipercaya menetapkan prioritas penyaluran di tengah tekanan dari sejumlah pihak yang berkepentingan.",o:[["Menetapkan kriteria yang objektif dan terukur, menyalurkan bantuan berdasarkan data yang terverifikasi, lalu mengumumkannya secara transparan.",5],["Mendahulukan warga yang paling awal mendaftarkan permohonannya.",4],["Membagi dana secara merata kepada semua pemohon agar tampak adil.",3],["Mendahulukan kerabat dan kenalan yang Anda ketahui membutuhkan.",2],["Menunda penyaluran hingga tersedia tambahan dana yang mencukupi.",1]],e:"Poin 5 objektif dan transparan. Poin 4 sederhana namun tidak menjangkau yang paling membutuhkan. Poin 3 tidak efektif. Poin 2 nepotisme. Poin 1 mengabaikan kebutuhan mendesak."},
{k:"Pengambilan Keputusan",s:"Sistem informasi layanan mendadak lumpuh ketika Anda tengah melayani seorang pemohon, sedangkan prosedur manual sebagai alternatif belum Anda kuasai sepenuhnya dan atasan sedang tidak berada di tempat.",o:[["Menanyakan prosedur manual kepada rekan yang berkompeten atau atasan melalui telepon, menginformasikan kondisi kepada pemohon, lalu melayani sesuai prosedur tersebut.",5],["Meminta pemohon kembali pada hari lain setelah sistem pulih seperti sedia kala.",4],["Mencatat data pemohon secara sementara tanpa mengikuti prosedur baku.",3],["Meminta rekan lain mengambil alih pelayanan terhadap pemohon tersebut.",2],["Menutup sementara loket pelayanan hingga sistem kembali normal.",1]],e:"Poin 5 mencari solusi dalam batas kewenangan. Poin 4 menunda layanan. Poin 3 berisiko kekeliruan. Poin 2 melempar tugas. Poin 1 menghentikan layanan."},
{k:"Kerja Sama",s:"Ide Anda ditolak tim padahal Anda yakin ide itu lebih baik.",o:[["Menerima keputusan tim, menjalankannya dengan baik, dan mengusulkan evaluasi dengan data di akhir.",5],["Menjelaskan ulang ide dengan data sampai tim setuju.",4],["Menjalankan ide sendiri di bagian Anda.",3],["Diam dan bekerja seadanya.",2],["Keluar dari tim.",1]],e:"Poin 5 menghargai keputusan kolektif. Poin 4 memaksa. Poin 3 memecah kerja. Poin 2 kehilangan komitmen. Poin 1 ekstrem."},
{k:"Kerja Sama",s:"Rekan satu tim kesulitan dan hasil pekerjaannya menghambat target kelompok.",o:[["Menanyakan kendalanya, membantu bagian yang sulit, dan menyampaikan kebutuhan dukungan kepada ketua.",5],["Mengerjakan ulang bagiannya.",4],["Menegurnya agar lebih serius.",3],["Melaporkannya kepada atasan.",2],["Membiarkan karena itu bagiannya.",1]],e:"Poin 5 membangun tim. Poin 4 menyelesaikan gejala. Poin 3 tanpa solusi. Poin 2 tanpa upaya bantuan. Poin 1 abai."},
{k:"Kerja Sama",s:"Rapat tim didominasi satu orang sehingga anggota lain enggan bicara.",o:[["Mengusulkan giliran bicara dan meminta pendapat anggota yang diam secara santun.",5],["Menyampaikan kepada ketua rapat setelah selesai.",4],["Menyampaikan pendapat Anda sendiri dengan tegas.",3],["Mengikuti arus rapat.",2],["Memotong pembicaraan orang tersebut.",1]],e:"Poin 5 inklusif. Poin 4 menunda. Poin 3 hanya diri sendiri. Poin 2 pasif. Poin 1 tidak santun."},
{k:"Kerja Sama",s:"Dua unit berbeda mengerjakan hal yang tumpang tindih dan saling mengklaim.",o:[["Mengusulkan pertemuan kedua unit untuk memetakan peran dan membuat kesepakatan tertulis.",5],["Melaporkan tumpang tindih kepada pimpinan.",4],["Menyelesaikan bagian unit Anda lebih dulu.",3],["Menunggu salah satu unit mengalah.",2],["Menyalahkan unit lain.",1]],e:"Poin 5 membangun aliansi. Poin 4 meminta pimpinan memutuskan. Poin 3 mengabaikan koordinasi. Poin 2 pasif. Poin 1 memperkeruh."},
{k:"Pengembangan Diri dan Orang Lain",s:"Anda mendapat kesempatan pelatihan, tetapi jadwalnya bertabrakan dengan pekerjaan.",o:[["Mengatur jadwal bersama atasan dan rekan agar pelatihan diikuti, lalu membagikan ilmunya.",5],["Mengikuti pelatihan dan menyelesaikan pekerjaan sesudahnya.",4],["Menunda pelatihan ke periode lain.",3],["Mengutus rekan menggantikan.",2],["Melewatkan pelatihan.",1]],e:"Poin 5 memaksimalkan pengembangan dan berbagi. Poin 4 berisiko beban. Poin 3 menunda. Poin 2 mengalihkan. Poin 1 menyia-nyiakan."},
{k:"Pengembangan Diri dan Orang Lain",s:"Bawahan Anda melakukan kesalahan dan merasa malu.",o:[["Berbicara empat mata, mengapresiasi usahanya, membahas perbaikan, dan memberi tugas lanjutan.",5],["Memberi tahu cara yang benar tanpa membahas perasaannya.",4],["Mengganti tugasnya dengan orang lain.",3],["Menegur di depan tim.",2],["Membiarkan agar ia belajar sendiri.",1]],e:"Poin 5 membina dengan empati. Poin 4 kurang personal. Poin 3 mematikan peluang belajar. Poin 2 mempermalukan. Poin 1 abai."},
{k:"TIK – Mengelola Perubahan",s:"Aplikasi kerja diperbarui dan tampilannya berubah drastis sehingga banyak rekan mengeluh.",o:[["Mempelajarinya lebih dulu, lalu berbagi tips dan masukan pengguna kepada tim pengembang.",5],["Mengikuti pelatihan resmi dan menggunakannya.",4],["Menggunakan seadanya sambil menunggu perbaikan.",3],["Tetap memakai versi lama.",2],["Ikut mengeluh di grup.",1]],e:"Poin 5 adaptif dan kontributif. Poin 4 pasif. Poin 3 minim usaha. Poin 2 menolak perubahan. Poin 1 memperkuat resistensi."},
{k:"TIK – Mengelola Perubahan",s:"Atasan meminta Anda mengajari rekan senior memakai aplikasi baru yang gagap teknologi.",o:[["Mengajar bertahap sesuai kecepatan belajarnya, memberi latihan, dan menghargai pengalamannya.",5],["Membuat video tutorial untuknya.",4],["Mengajar sekali lalu menyuruh berlatih sendiri.",3],["Meminta pihak lain mengajarinya.",2],["Menolak karena bukan tugas Anda.",1]],e:"Poin 5 sabar dan personal. Poin 4 kurang interaktif. Poin 3 tergesa. Poin 2 mengalihkan. Poin 1 menolak."},
{k:"TIK – Mengelola Perubahan",s:"Anda menerima surel mencurigakan yang meminta kata sandi akun kantor atas nama TI.",o:[["Tidak membalas, melaporkannya ke tim TI, dan mengingatkan rekan agar waspada.",5],["Menghapus surel tersebut.",4],["Membalas dengan menanyakan identitas pengirim.",3],["Meneruskannya ke rekan untuk dicek.",2],["Mengirim kata sandi karena mengaku TI.",1]],e:"Poin 5 melindungi organisasi. Poin 4 melindungi diri sendiri. Poin 3 berisiko. Poin 2 menyebarkan ancaman. Poin 1 fatal."},
{k:"Sosial Budaya",s:"Rekan beragama berbeda sedang beribadah saat rapat penting dijadwalkan.",o:[["Mengusulkan penyesuaian jadwal rapat agar semua dapat hadir dan menyampaikannya ke ketua.",5],["Melanjutkan rapat tanpa rekan tersebut dan memberi tahu hasilnya.",4],["Menunggu sampai ibadah selesai tanpa usul.",3],["Meminta ia mempercepat ibadahnya.",2],["Mengabaikan karena rapat penting.",1]],e:"Poin 5 menghormati keberagaman sambil menjaga produktivitas. Poin 4 mengorbankan inklusi. Poin 3 pasif. Poin 2 tidak menghargai. Poin 1 intoleran."},
{k:"Sosial Budaya",s:"Rekan sebangku sering menggunakan candaan bernuansa suku tertentu yang membuat orang lain tersinggung.",o:[["Menegur secara pribadi, menjelaskan dampaknya, dan mengajak memakai candaan yang aman.",5],["Menegur di depan orang banyak.",4],["Mengabaikan dan menjauh.",3],["Ikut tertawa agar suasana cair.",2],["Menyebarkan candaan tersebut.",1]],e:"Poin 5 beradab dan edukatif. Poin 4 mempermalukan. Poin 3 membiarkan. Poin 2 membenarkan. Poin 1 memperparah."},
{k:"Sosial Budaya",s:"Anda diundang acara adat setempat dengan tata cara yang belum Anda pahami.",o:[["Menghadiri dan menanyakan tata caranya kepada tokoh setempat, lalu mengikutinya dengan hormat.",5],["Menghadiri dan mengamati perilaku orang lain.",4],["Hadir sebentar lalu pamit.",3],["Menolak karena tidak paham.",2],["Menganggap acara itu tidak penting.",1]],e:"Poin 5 menghargai budaya secara aktif. Poin 4 pasif. Poin 3 formalitas. Poin 2 menghindar. Poin 1 merendahkan."},
{k:"Anti Radikalisme",s:"Teman Anda mengajak mengikuti kelompok yang menolak Pancasila dan menganggap pemerintah kafir.",o:[["Menolak, menjelaskan nilai kebangsaan dengan argumen, dan menyarankan ia berdiskusi dengan tokoh terpercaya.",5],["Menolak dan menjauhi teman itu.",4],["Melaporkannya ke pihak berwajib tanpa bicara dengannya.",3],["Menghadiri sekali untuk mengetahui isinya.",2],["Bergabung karena penasaran.",1]],e:"Poin 5 menolak dan membina. Poin 4 meninggalkannya. Poin 3 melewatkan pendekatan persuasif. Poin 2 berisiko. Poin 1 terpapar."},
{k:"Anti Radikalisme",s:"Anda membaca informasi viral yang memprovokasi kebencian terhadap kelompok tertentu.",o:[["Memeriksa kebenarannya dari sumber resmi, tidak menyebarkan, dan meluruskannya bila ditanya.",5],["Tidak menyebarkan dan mengabaikannya.",4],["Menyebarkan disertai peringatan hati-hati.",3],["Menyebarkan karena banyak yang percaya.",2],["Menambahkan komentar yang mendukung.",1]],e:"Poin 5 literasi digital aktif. Poin 4 pasif. Poin 3 tetap menyebarkan. Poin 2 ikut arus. Poin 1 memperkuat kebencian."}
];
const QT={"Pelayanan Publik":"Tindakan manakah yang paling tepat Anda lakukan sebagai petugas pelayanan dalam situasi tersebut?","Integritas":"Sikap manakah yang paling mencerminkan integritas Anda dalam situasi tersebut?","Orientasi pada Hasil":"Langkah manakah yang paling tepat Anda tempuh untuk menjamin hasil kerja yang optimal?","Pengambilan Keputusan":"Keputusan manakah yang paling tepat Anda ambil dalam situasi tersebut?","Kerja Sama":"Apakah yang sebaiknya Anda lakukan agar kerja sama tim tetap berjalan efektif?","Pengembangan Diri dan Orang Lain":"Apakah yang sebaiknya Anda lakukan dalam situasi tersebut?","TIK \u2013 Mengelola Perubahan":"Sikap manakah yang paling tepat Anda tunjukkan dalam menghadapi perubahan tersebut?","Sosial Budaya":"Bagaimanakah sikap Anda yang paling tepat dalam situasi tersebut?","Anti Radikalisme":"Tindakan manakah yang paling tepat Anda lakukan dalam situasi tersebut?"};
BANK.forEach(q=>q.t=QT[q.k]);
const L="ABCDE",$=id=>document.getElementById(id),app=$("app");
let st={name:"",qs:[],ans:[],i:0,view:"home"};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function start(){st.name=($("nm")?.value||"").trim()||"Peserta";st.qs=BANK.map(q=>({...q,o:sh(q.o)}));st.ans=Array(st.qs.length).fill(null);st.i=0;st.end=Date.now()+3000000;clearInterval(st.t);st.t=setInterval(tick,1000);st.view="quiz";render();scrollTo(0,0)}
function head(){return ""}
function render(){
 if(st.view==="home"){app.innerHTML=`<h1 style="color:var(--or);text-align:center;margin:40px 0 24px">Latihan Soal TKP</h1><div class="card"><label for="nm"><b>Nama peserta</b></label><input id="nm" type="text" placeholder="Tulis nama Anda" maxlength="60" value="${esc(st.name==="Peserta"?"":st.name)}"><button class="btn g" onclick="start()">Mulai</button></div>`;return}
 if(false){const n=BANK.length;app.innerHTML=`${head()}<h1>Tryout TKP</h1><p class="tag">Latihan Tes Karakteristik Pribadi bergaya HOTS dengan pembahasan lengkap.</p>
 <div class="card"><div class="grid"><div class="feat"><b>${n} soal</b>Kompetensi: pelayanan publik, integritas, orientasi hasil, keputusan, kerja sama, dan lainnya.</div><div class="feat"><b>Opsi diacak</b>Posisi jawaban poin 5 berubah di setiap percobaan, jadi tidak bisa ditebak.</div><div class="feat"><b>Skor 1–5</b>Setiap opsi punya poin berbeda. Nilai maksimal ${n*5}.</div><div class="feat"><b>Unduh PDF</b>Jawaban Anda, nilai, dan pembahasan dapat disimpan.</div></div></div>
 <div class="card"><label for="nm"><b>Nama peserta</b></label><input id="nm" type="text" placeholder="Tulis nama Anda" maxlength="60" value="${esc(st.name==="Peserta"?"":st.name)}"><button class="btn g" onclick="start()">Mulai Tryout</button></div>`;return}
 if(st.view==="quiz"){const q=st.qs[st.i],n=st.qs.length,done=st.ans.filter(x=>x!==null).length,last=st.i===n-1;
 app.innerHTML=`<div class="top">${head()}<span class="note">Terjawab ${done}/${n} · Sisa waktu <b id="tm">${fmt()}</b></span></div><div class="bar"><i style="width:${done/n*100}%"></i></div>
 <div class="card"><span class="chip">Soal ${st.i+1} dari ${n}</span><span class="chip b">${esc(q.k)}</span><p class="q">${esc(q.s)}<br><b>${esc(q.t)}</b></p>
 ${q.o.map((o,j)=>`<button class="opt ${st.ans[st.i]===j?"sel":""}" onclick="pick(${j})"><span class="ltr">${L[j]}</span><span>${esc(o[0])}</span></button>`).join("")}
 <div class="row"><button class="btn b" ${st.i?"":"disabled"} onclick="go(-1)">Sebelumnya</button>${last?`<button class="btn g" onclick="finish()">Selesai${done<n?` (${n-done} belum dijawab)`:""}</button>`:`<button class="btn" onclick="go(1)">Berikutnya</button>`}</div></div>
 <div class="card"><b>Navigasi soal</b><div class="nav">${st.qs.map((_,k)=>`<button class="dot ${k===st.i?"cur":st.ans[k]!==null?"done":""}" onclick="st.i=${k};render()">${k+1}</button>`).join("")}</div></div>`;return}
 const r=calc();
 app.innerHTML=`${head()}<h1 style="font-size:clamp(28px,6vw,40px)">Hasil Tryout</h1><p class="tag">${esc(st.name)}</p>
 <div class="score"><div class="n">${r.total}</div><small>dari ${r.max} poin · ${r.pct}% · ${r.answered}/${st.qs.length} soal terjawab</small></div>
 <div class="card"><b>Capaian per kompetensi</b>${r.komp.map(k=>`<div class="kom"><div class="l"><span>${esc(k.n)}</span><span>${k.p}/${k.m}</span></div><div class="bar" style="margin:4px 0"><i style="width:${k.p/k.m*100}%"></i></div></div>`).join("")}
 <div class="row"><button class="btn g" id="dl" onclick="pdf()">Unduh PDF (jawaban, nilai, pembahasan)</button><button class="btn p" onclick="st.view='home';render()">Coba Lagi</button></div><p class="note" id="dlm"></p></div>
 <h2>Pembahasan</h2>${st.qs.map((q,k)=>{const a=st.ans[k];return `<div class="card rv"><span class="chip">Soal ${k+1}</span><span class="chip b">${esc(q.k)}</span><span class="chip">Poin Anda: ${a===null?0:q.o[a][1]}</span><p class="q">${esc(q.s)}<br><b>${esc(q.t)}</b></p>
 ${q.o.map((o,j)=>`<div class="opt ${o[1]===5?"best":""} ${a===j?"mine":""}"><span class="ltr">${L[j]}</span><span>${esc(o[0])}${a===j?" <b>(Jawaban Anda)</b>":""}</span><span class="pt">${o[1]} poin</span></div>`).join("")}
 <div class="ex"><b>Pembahasan:</b> ${esc(q.e)}</div></div>`}).join("")}`;
}
function pick(j){st.ans[st.i]=j;render()}
function go(d){st.i+=d;render();scrollTo(0,0)}
function fmt(){const s=Math.max(0,Math.round((st.end-Date.now())/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function tick(){if(st.view!=="quiz"){clearInterval(st.t);return}const t=$("tm");if(t)t.textContent=fmt();if(st.end-Date.now()<=0)finish()}
function finish(){clearInterval(st.t);st.view="result";render();scrollTo(0,0)}
function calc(){let total=0,answered=0;const m={};st.qs.forEach((q,k)=>{const a=st.ans[k],p=a===null?0:q.o[a][1];total+=p;if(a!==null)answered++;m[q.k]=m[q.k]||{n:q.k,p:0,m:0};m[q.k].p+=p;m[q.k].m+=5});const max=st.qs.length*5;return{total,max,answered,pct:Math.round(total/max*100),komp:Object.values(m)}}
async function pdf(){
 const msg=$("dlm");
 try{
 const {jsPDF}=window.jspdf,d=new jsPDF({unit:"pt",format:"a4"}),W=595.28,H=841.89,M=40,CW=W-2*M;
 const RED=[211,47,47],DRK=[183,28,28],SOFT=[253,232,232],INK=[43,17,20],MUT=[122,90,93],LN=[233,184,184],WH=[255,255,255];
 const fc=c=>d.setFillColor(...c),dc=c=>d.setDrawColor(...c);
 const tx=(t,x,yy,sz,b,c,o)=>{d.setFont("helvetica",b?"bold":"normal");d.setFontSize(sz);d.setTextColor(...(c||INK));d.text(String(t),x,yy,o)};
 const wrap=(t,sz,w)=>{d.setFont("helvetica","normal");d.setFontSize(sz);return d.splitTextToSize(String(t),w)};
 let y=0;const need=h=>{if(y+h>H-50){d.addPage();y=M}};
 const r=calc(),n=st.qs.length;
 fc(RED);d.rect(0,0,W,120,"F");fc(DRK);d.rect(0,120,W,5,"F");
 tx("LATIHAN SOAL TKP",M,52,26,true,WH);
 tx("Laporan Hasil dan Pembahasan",M,74,12,false,WH);
 tx(st.name+"   |   "+new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}),M,100,10.5,false,WH);
 y=148;
 fc(SOFT);dc(LN);d.setLineWidth(.8);d.roundedRect(M,y,CW,100,10,10,"FD");
 [["NILAI",String(r.total),M+26,`dari ${r.max} poin`],["PERSENTASE",r.pct+"%",M+190,"capaian total"],["TERJAWAB",`${r.answered}/${n}`,M+350,"soal"]].forEach(c=>{tx(c[0],c[2],y+24,9,true,MUT);tx(c[1],c[2],y+64,34,true,RED);tx(c[3],c[2],y+84,9,false,MUT)});
 y+=126;
 tx("Capaian per kompetensi",M,y,13,true,DRK);y+=14;
 r.komp.forEach(k=>{need(30);tx(k.n,M,y+10,10);tx(`${k.p}/${k.m}`,W-M,y+10,10,true,DRK,{align:"right"});fc(SOFT);d.roundedRect(M,y+15,CW,7,3.5,3.5,"F");if(k.p>0){fc(RED);d.roundedRect(M,y+15,Math.max(7,CW*k.p/k.m),7,3.5,3.5,"F")}y+=30});
 y+=8;need(50);
 tx("Cara membaca pembahasan",M,y+8,11,true,DRK);y+=20;
 [[SOFT,RED,"Jawaban poin tertinggi (5)",M],[[238,238,238],MUT,"Jawaban Anda",M+190],[WH,LN,"Opsi lainnya",M+320]].forEach(l=>{fc(l[0]);dc(l[1]);d.setLineWidth(1);d.roundedRect(l[3],y,22,12,3,3,"FD");tx(l[2],l[3]+30,y+9.5,9.5,false,INK)});
 y+=34;
 st.qs.forEach((q,k)=>{
  const a=st.ans[k],pt=a===null?0:q.o[a][1];
  const status=a===null?"TIDAK DIJAWAB":pt===5?"TEPAT":pt===4?"HAMPIR TEPAT":"PERLU DIPERBAIKI";
  const ql=wrap(q.s,10.5,CW-8);
  need(34+ql.length*14+78);
  fc(RED);d.roundedRect(M,y,CW,24,6,6,"F");
  tx("SOAL "+(k+1),M+12,y+16,10.5,true,WH);tx(q.k.toUpperCase(),M+74,y+16,8.5,false,WH);
  tx(status+"  |  "+pt+"/5",W-M-12,y+16,9.5,true,WH,{align:"right"});
  y+=36;
  ql.forEach(l=>{tx(l,M+4,y+10,10.5,false);y+=14});
  d.setFont("helvetica","bold");d.setFontSize(10.5);d.splitTextToSize(q.t,CW-8).forEach(l=>{tx(l,M+4,y+12,10.5,true,DRK);y+=14});
  y+=8;
  q.o.forEach((o,j)=>{
   const best=o[1]===5,mine=a===j,ol=wrap(o[0],9.5,CW-132),h=Math.max(32,ol.length*12.5+14);
   need(h+6);
   if(best){fc(SOFT);dc(RED);d.setLineWidth(1.4)}else if(mine){fc([238,238,238]);dc(MUT);d.setLineWidth(1.2)}else{fc(WH);dc(LN);d.setLineWidth(.6)}
   d.roundedRect(M,y,CW,h,6,6,"FD");
   fc(best?RED:mine?MUT:SOFT);d.circle(M+17,y+h/2,9,"F");
   tx(L[j],M+17,y+h/2+3.5,9.5,true,best||mine?WH:DRK,{align:"center"});
   ol.forEach((l,i)=>tx(l,M+36,y+15+i*12.5,9.5,false));
   tx(o[1]+" poin",W-M-10,y+15,9.5,true,best?RED:MUT,{align:"right"});
   if(mine)tx("JAWABAN ANDA",W-M-10,y+27,7.5,true,MUT,{align:"right"});
   y+=h+6;
  });
  const el=wrap(q.e,9.5,CW-34),eh=el.length*12.5+34;
  need(eh+10);
  fc([255,247,247]);dc(LN);d.setLineWidth(.6);d.roundedRect(M,y,CW,eh,6,6,"FD");
  fc(RED);d.rect(M,y+5,4,eh-10,"F");
  tx("PEMBAHASAN",M+16,y+18,9,true,RED);
  el.forEach((l,i)=>tx(l,M+16,y+32+i*12.5,9.5,false));
  y+=eh+24;
 });
 const pc=d.getNumberOfPages();
 for(let i=1;i<=pc;i++){d.setPage(i);dc(LN);d.setLineWidth(.6);d.line(M,H-34,W-M,H-34);tx("Latihan Soal TKP  -  "+st.name,M,H-20,8.5,false,MUT);tx("Halaman "+i+" dari "+pc,W-M,H-20,8.5,false,MUT,{align:"right"})}
 await (await claude.use("downloads")).save({filename:"hasil-tryout-tkp-"+st.name.replace(/[^\w-]+/g,"-")+".pdf",data:d.output("blob")});
 msg.textContent="PDF siap disimpan.";
 }catch(e){msg.textContent=e&&e.code==="declined"?"Unduhan dibatalkan.":"Unduhan PDF belum tersedia di tampilan ini.";}
}
